name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,    os: ubuntu-22.04 }
          - { name: windows-x64,     os: windows-latest }
          - { name: macos-universal, os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev

      - name: Configurar (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configurar (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64

      - name: Configurar (macOS, universal)
        if: runner.os == 'macOS'
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Compilar
        run: cmake --build build --config Release --parallel 4

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist && cd build/Bailarina_artefacts/Release
          cp -r VST3/Bailarina.vst3 ../../../dist/
          cp Standalone/Bailarina ../../../dist/Bailarina-standalone
          cd ../../../dist && zip -qr ../Bailarina-${{ matrix.name }}.zip .

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item -Recurse build/Bailarina_artefacts/Release/VST3/Bailarina.vst3 dist/
          Copy-Item build/Bailarina_artefacts/Release/Standalone/Bailarina.exe dist/
          Compress-Archive -Path dist/* -DestinationPath Bailarina-${{ matrix.name }}.zip

      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist && cd build/Bailarina_artefacts/Release
          cp -R VST3/Bailarina.vst3 AU/Bailarina.component Standalone/Bailarina.app ../../../dist/
          cd ../../.. && codesign --force --deep -s - dist/Bailarina.vst3 dist/Bailarina.component dist/Bailarina.app
          lipo -archs dist/Bailarina.vst3/Contents/MacOS/Bailarina
          ditto -c -k dist Bailarina-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Bailarina-${{ matrix.name }}
          path: Bailarina-${{ matrix.name }}.zip

  # Publica una release con los tres zips cuando:
  #  - se sube una etiqueta v*, o
  #  - llega a main un commit cuyo mensaje empieza por "Release v" (la etiqueta sale del archivo VERSION).
  release:
    name: Publicar release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "tag=v$(tr -d ' \n\r' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: dist }
      - run: cp docs/Bailarina_manual_EN_ES.pdf dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Bailarina ${{ steps.ver.outputs.tag }}
          body: |
            VST3 para Linux, Windows (x64) y macOS (universal, con Audio Unit), más el manual en inglés y castellano.
            Las versiones de Windows y macOS se compilan automáticamente y no se han probado todavía en un DAW.
            La de macOS no está notarizada: si el sistema la bloquea, `xattr -cr` sobre el plugin.
          files: dist/*
